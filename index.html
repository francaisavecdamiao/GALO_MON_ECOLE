<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GALOLINGO — ESCOLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Carregamento da fonte Feather-Bold */
  @font-face {
    font-family: 'Feather Bold';
    src: url('fonts/Feather-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
  }

  :root{
    /* Sua Paleta Solicitada */
    --rosa: #F2A7AD;
    --laranja-escuro: #EF7211;
    --azul-claro: #C2EDF2;
    --amarelo: #F2A444;
    --laranja-salmao: #F2B28D;
    --vermelho: #D93636;

    /* Derivações para sombras e estados */
    --laranja-dark: #C95C08;
    --vermelho-dark: #B02626;
    --azul-dark: #8EC2C9;
    --green-correct: #48B832;
    --green-correct-dark: #379425;
    
    --text: #3C3C3C;
    --text-light: #6b7280;
    --bg: #F7F9FA;
    --card: #FFFFFF;
    --border: #E5E5E5;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
  }

  /* Uso da fonte Feather-Bold em títulos e textos grandes */
  h1, h2, .level-label, .score-badge, .btn, .chip-num, .chip-pts, .final-score, .fr-sentence, .pt-sentence {
    font-family: 'Feather Bold', 'Nunito', sans-serif;
  }

  #page{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display:flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }

  /* ---------- TOPBAR ---------- */
  #topbar{
    position: sticky;
    top:0;
    z-index: 10;
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 10px 16px 12px;
  }
  .topbar-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .level-label{
    font-size: 16px;
    color: var(--text);
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
    text-transform: lowercase;
  }
  .score-badge{
    font-size: 15px;
    background: #FFF5EA;
    color: var(--laranja-escuro);
    border: 2px solid var(--amarelo);
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
    flex-shrink:0;
  }
  .score-max{ font-weight:600; opacity:.7; font-size:12px; }
  .progress-track{
    background: var(--border);
    border-radius: 999px;
    height: 12px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--amarelo), var(--laranja-escuro));
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* ---------- LAYOUT ---------- */
  main#content{
    flex:1;
    padding: 20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .btn{
    font-size: 18px;
    letter-spacing: .3px;
    text-transform: lowercase;
    border: none;
    border-radius: 16px;
    padding: 15px 20px;
    cursor: pointer;
    color: #fff;
    background: var(--laranja-escuro);
    box-shadow: 0 5px 0 var(--laranja-dark);
    transition: transform .05s ease, box-shadow .05s ease, opacity .2s ease;
  }
  .btn:active:not(:disabled){ transform: translateY(4px); box-shadow: 0 1px 0 transparent; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-block{ width:100%; margin-top:auto; position: sticky; bottom: 16px; }

  .footer-space{ flex:1; }

  /* ---------- HOME / LEVEL COMPLETE / FINAL ---------- */
  .home-card{
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 22px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    animation: popIn .35s ease;
  }
  
  .mascot-img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    margin-bottom: 8px;
  }

  .home-card h1{ font-size: 26px; color: var(--text); text-transform: lowercase; }
  .home-sub{ font-size:15px; color: var(--text-light); margin:0; line-height:1.5; }
  .level-preview{ width:100%; display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .level-chip{
    display:flex; align-items:center; gap:10px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-weight:700;
    font-size:14px;
    text-align:left;
  }
  .chip-num{
    background: var(--rosa);
    color:#fff;
    width:28px; height:28px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .chip-pts{ margin-left:auto; color: var(--laranja-escuro); }

  .final-score{
    font-size: 44px;
    color: var(--laranja-escuro);
    margin: 4px 0;
  }
  .final-score span{ font-size:18px; color: var(--text-light); font-weight:700; }
  .breakdown{ width:100%; margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .breakdown-row{
    display:flex; justify-content:space-between;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-weight:700;
    font-size:14px;
  }

  /* ---------- QUESTION CARD ---------- */
  .question-card{
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    animation: popIn .3s ease;
  }
  .instruction{
    font-size:13px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-light);
    font-weight:700;
    margin:0 0 8px;
  }
  .fr-sentence{
    font-size: 21px;
    color: var(--text);
    line-height:1.4;
    margin: 0 0 18px;
  }
  .pt-sentence{
    font-size: 20px;
    color: var(--text);
    line-height:1.4;
    margin: 0 0 18px;
    background: #F0FAFC;
    border-left: 4px solid var(--azul-dark);
    padding: 10px 14px;
    border-radius: 8px;
  }

  .options-grid{ display:flex; flex-direction:column; gap:10px; }
  .option-card{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size: 15px;
    text-align:left;
    background: #fff;
    border: 2px solid var(--border);
    border-bottom-width:4px;
    border-radius: var(--radius-md);
    padding: 13px 16px;
    color: var(--text);
    cursor:pointer;
    transition: all .12s ease;
  }
  .option-card:hover:not(:disabled){ background:#FAF5F0; }
  .option-card.selected{ border-color: var(--laranja-salmao); background:#FFF8F5; color: var(--laranja-escuro); }
  .option-card.correct{ border-color: var(--green-correct); background:#EAF9E7; color: var(--green-correct-dark); }
  .option-card.wrong{ border-color: var(--vermelho); background:#FDF0F0; color: var(--vermelho-dark); }
  .option-card:disabled{ cursor:default; }

  /* blanks (Nível 1 e 2) */
  .blank{
    display:inline-block;
    min-width: 34px;
    text-align:center;
    padding: 2px 10px;
    margin: 0 2px;
    border-radius: 8px;
    background: #EEE;
    color: var(--text-light);
    font-weight:800;
    border-bottom: 3px solid #CCC;
  }
  .blank-filled{ background:#FFF8F5; color: var(--laranja-escuro); border-bottom-color: var(--laranja-escuro); }
  .blank-correct{ background:#EAF9E7; color: var(--green-correct-dark); border-bottom-color: var(--green-correct); }
  .blank-wrong{ background:#FDF0F0; color: var(--vermelho-dark); border-bottom-color: var(--vermelho); }

  .chip-label{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
    color: var(--text-light); margin: 14px 0 8px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip-option{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size: 14px;
    background:#fff;
    border: 2px solid var(--border);
    border-bottom-width:4px;
    border-radius: 999px;
    padding: 9px 16px;
    cursor:pointer;
    color: var(--text);
    transition: all .12s ease;
  }
  .chip-option.selected{ border-color: var(--laranja-salmao); background:#FFF8F5; color:var(--laranja-escuro); }
  .chip-option.correct{ border-color: var(--green-correct); background:#EAF9E7; color:var(--green-correct-dark); }
  .chip-option.wrong{ border-color: var(--vermelho); background:#FDF0F0; color:var(--vermelho-dark); }

  /* build row (Nível 3) */
  .build-row{
    min-height: 52px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-md);
    padding: 10px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    margin-bottom: 16px;
    transition: border-color .2s ease, background .2s ease;
  }
  .build-row.row-correct{ border-style:solid; border-color: var(--green-correct); background:#EAF9E7; }
  .build-row.row-wrong{ border-style:solid; border-color: var(--vermelho); background:#FDF0F0; }
  .build-placeholder{ color: var(--text-light); font-size:13px; font-style:italic; }

  .gabarito{
    font-size: 13px;
    color: var(--vermelho-dark);
    background: #FDF0F0;
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin: -6px 0 14px;
  }

  .bank-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tile{
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size: 14px;
    background:#fff;
    border: 2px solid var(--border);
    border-bottom-width:4px;
    border-radius: 10px;
    padding: 9px 14px;
    cursor:pointer;
    color: var(--text);
    transition: transform .08s ease;
  }
  .tile:active{ transform: scale(.94); }
  .tile.placed{ background:#FFF8F5; border-color: var(--laranja-salmao); color: var(--laranja-escuro); }
  .tile.placed.correct{ background:#EAF9E7; border-color: var(--green-correct); color: var(--green-correct-dark); }
  .tile.placed.wrong{ background:#FDF0F0; border-color: var(--vermelho); color: var(--vermelho-dark); }

  @keyframes popIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>

    correctTokens:["Sophie","a","un","surligneur","jaune","mais","Lucas","préfère","le","feutre","noir."],
    distractors:["faune","soir"] },
  { pt:"Cada criança coloca a régua e a borracha sobre a mesa.",
    correctTokens:["Chaque","enfant","pose","la","règle","et","la","gomme","sur","la","table."],
    distractors:["aigle","pomme"] }
];

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const state = {
  screen: 'home',
  level: 1,
  qIndex: 0,
  totalScore: 0,
  levelScores: {1:0, 2:0, 3:0},
  l1: null,
  l2: null,
  l3: null
};

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatScore(n){
  const rounded = Math.round(n*10)/10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

/* =========================================================
   SONOPLASTIA
   ========================================================= */
const SOUND_FILES = {
  click: 'click.mp3',
  ok: 'ok.mp3',
  falha: 'falha.mp3',
  level: 'level.mp3',
  levelfail: 'levelfail.mp3',
  win: 'win01.mp3',
  losing: 'losing.mp3'
};

function playSound(name){
  try{
    const src = SOUND_FILES[name];
    if(!src) return;
    const audio = new Audio(src);
    audio.play().catch(()=>{});
  }catch(e){}
}

/* =========================================================
   NAVEGAÇÃO E REGRAS
   ========================================================= */
function levelMaxPts(lvl){ return lvl===1?20:(lvl===2?35:45); }
function levelPct(lvl){ return (state.levelScores[lvl]/levelMaxPts(lvl))*100; }

function startGame(){
  playSound('click');
  state.screen='game'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0,2:0,3:0};
  setupCurrentQuestion();
  render();
}

function setupCurrentQuestion(){
  if(state.level===1) setupLevel1Question(state.qIndex);
  else if(state.level===2) setupLevel2Question(state.qIndex);
  else setupLevel3Question(state.qIndex);
}

function nextQuestion(){
  playSound('click');
  state.qIndex++;
  if(state.qIndex>=10){
    state.screen='levelComplete';
    playSound(levelPct(state.level)>=70 ? 'level' : 'levelfail');
    render();
    return;
  }
  setupCurrentQuestion();
  render();
}

function startNextLevel(){
  playSound('click');
  state.level++; state.qIndex=0; state.screen='game';
  setupCurrentQuestion();
  render();
}

function goFinal(){
  playSound('click');
  state.screen='final';
  playSound(state.totalScore>=75 ? 'win' : 'losing');
  render();
}

function resetGame(){
  playSound('click');
  state.screen='home'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0,2:0,3:0};
  render();
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(){
  renderTopbar();
  const content = document.getElementById('content');
  if(state.screen==='home'){ content.innerHTML = homeTemplate(); }
  else if(state.screen==='game'){
    if(state.level===1) renderLevel1();
    else if(state.level===2) renderLevel2();
    else renderLevel3();
  }
  else if(state.screen==='levelComplete'){ content.innerHTML = levelCompleteTemplate(); }
  else if(state.screen==='final'){ content.innerHTML = finalTemplate(); }
}

function renderTopbar(){
  const bar = document.getElementById('topbar');
  const scoreTxt = formatScore(state.totalScore);
  let progressPct = 0;
  let levelLabel = 'galolingo';
  if(state.screen==='game'){
    const completed = (state.level-1)*10 + state.qIndex;
    progressPct = Math.round((completed/30)*100);
    levelLabel = `nível ${state.level} · questão ${state.qIndex+1}/10`;
  } else if(state.screen==='levelComplete'){
    progressPct = Math.round((state.level*10/30)*100);
    levelLabel = `nível ${state.level} concluído`;
  } else if(state.screen==='final'){
    progressPct = 100;
    levelLabel = 'jogo concluído';
  } else {
    levelLabel = 'pronto para começar?';
  }
  bar.innerHTML = `
    <div class="topbar-row">
      <span class="level-label">${levelLabel}</span>
      <span class="score-badge">🏆 ${scoreTxt}<span class="score-max">/100</span></span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  `;
}

/* =========================================================
   TELAS DE ESTRUTURA (HOME / LEVEL / FINAL)
   ========================================================= */
function homeTemplate(){
  return `
    <div class="home-card">
      <img src="images/galo.png" alt="Galo Galolingo" class="mascot-img">
      <h1>galolingo</h1>
      <p class="home-sub">Tema: ESCOLA. Complete os 3 níveis e conquiste até <strong>100 pontos</strong>!</p>
      <div class="level-preview">
        <div class="level-chip"><span class="chip-num">1</span> Complete a Lacuna <span class="chip-pts">20 pts</span></div>
        <div class="level-chip"><span class="chip-num">2</span> Lacunas Duplas <span class="chip-pts">35 pts</span></div>
        <div class="level-chip"><span class="chip-num">3</span> Monte a Frase <span class="chip-pts">45 pts</span></div>
      </div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="startGame()">começar</button>
  `;
}

function levelCompleteTemplate(){
  const lvl = state.level;
  const max = levelMaxPts(lvl);
  const earned = state.levelScores[lvl];
  const pct = levelPct(lvl);
  const passed = pct>=70;
  
  /* Uso de happygalo.png se for bem e sadgalo.png se for mal */
  const mascotImg = passed ? 'images/happygalo.png' : 'images/sadgalo.png';
  const moodMsg = passed
    ? 'Muito bem, esse galo está orgulhoso de você!'
    : 'Esse galo ficou meio apreensivo... vamos revisar mais um pouco!';
  const isLast = lvl===3;
  return `
    <div class="home-card">
      <img src="${mascotImg}" alt="Galo Galolingo" class="mascot-img">
      <h1>nível ${lvl} concluído!</h1>
      <p class="home-sub">Você fez <strong>${formatScore(earned)} / ${max}</strong> pontos neste nível (${Math.round(pct)}%).</p>
      <p class="home-sub">${moodMsg}</p>
      <p class="home-sub">Pontuação total: <strong>${formatScore(state.totalScore)} / 100</strong></p>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="${isLast ? 'goFinal()' : 'startNextLevel()'}">
      ${isLast ? 'ver resultado final' : 'continuar para o nível '+(lvl+1)}
    </button>
  `;
}

function finalTemplate(){
  const total = state.totalScore;
  const passed = total>=75;
  
  /* Uso de happygalo.png se for bem e sadgalo.png se for mal */
  const mascotImg = passed ? 'images/happygalo.png' : 'images/sadgalo.png';
  const msg = passed
    ? 'Parabéns! Esse galo está cantando de alegria — você mandou muito bem em francês! 🎉'
    : 'Esse galo ficou super triste... capriche mais um pouco na próxima tentativa e tenha mais dedicação nos estudos! 💪';
  return `
    <div class="home-card">
      <img src="${mascotImg}" alt="Galo Galolingo" class="mascot-img">
      <h1>resultado final</h1>
      <p class="final-score">${formatScore(total)}<span> / 100</span></p>
      <p class="home-sub">${msg}</p>
      <div class="breakdown">
        <div class="breakdown-row"><span>Nível 1 — Lacuna</span><span>${formatScore(state.levelScores[1])} / 20</span></div>
        <div class="breakdown-row"><span>Nível 2 — Lacunas</span><span>${formatScore(state.levelScores[2])} / 35</span></div>
        <div class="breakdown-row"><span>Nível 3 — Monte a Frase</span><span>${formatScore(state.levelScores[3])} / 45</span></div>
      </div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="resetGame()">jogar novamente</button>
  `;
}

function blankSpanHtml(selIdx, options, correctWord, checked, num){
  if(selIdx===null) return `<span class="blank">${num}</span>`;
  const word = options[selIdx];
  let cls = 'blank blank-filled';
  if(checked) cls = 'blank ' + (word===correctWord ? 'blank-correct' : 'blank-wrong');
  return `<span class="${cls}">${word}</span>`;
}

/* =========================================================
   NÍVEL 1 — LÓGICA E INTERFACE
   ========================================================= */
function setupLevel1Question(idx){
  const q = level1Data[idx];
  state.l1 = {
    step:'A',
    bOptions: shuffle(q.blank.options),
    bSelected:null, checkedA:false,
    trOptions: shuffle([{text:q.transCorrect,correct:true}, ...q.transWrong.map(w=>({text:w,correct:false}))]),
    trSelected:null, checkedB:false
  };
}

function renderLevel1(){
  const q = level1Data[state.qIndex];
  const s = state.l1;
  const content = document.getElementById('content');

  if(s.step==='A'){
    const span = blankSpanHtml(s.bSelected, s.bOptions, q.blank.correct, s.checkedA, 1);
    const sentence = q.frBlanked.replace('[ 1 ]', span);

    const btns = s.bOptions.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.blank.correct) cls+=' correct'; else if(i===s.bSelected) cls+=' wrong'; }
      else if(i===s.bSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedA?'disabled':''} onclick="selectL1Blank(${i})">${w}</button>`;
    }).join('');

    const btnLabel = s.checkedA ? 'continuar' : 'verificar lacuna';
    const btnOnclick = s.checkedA ? 'advanceL1Step()' : 'checkL1Blank()';
    const btnDisabled = !s.checkedA && s.bSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Complete a lacuna</p>
        <p class="fr-sentence">${sentence}</p>
        <p class="chip-label">Lacuna</p>
        <div class="chip-row">${btns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedB?'disabled':''} onclick="selectL1Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'próxima questão' : 'verificar tradução';
    const btnOnclick = s.checkedB ? 'nextQuestion()' : 'checkL1Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Escolha a tradução correta</p>
        <p class="fr-sentence">${q.frFull}</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function selectL1Blank(i){ playSound('click'); state.l1.bSelected=i; renderLevel1(); }
function checkL1Blank(){
  const q = level1Data[state.qIndex];
  const s = state.l1;
  s.checkedA = true;
  const isCorrect = s.bOptions[s.bSelected] === q.blank.correct;
  if(isCorrect){ playSound('ok'); state.levelScores[1]+=1; state.totalScore+=1; }
  else { playSound('falha'); }
  renderLevel1();
}
function advanceL1Step(){ playSound('click'); state.l1.step='B'; renderLevel1(); }

function selectL1Translation(i){ playSound('click'); state.l1.trSelected=i; renderLevel1(); }
function checkL1Translation(){
  const s = state.l1;
  s.checkedB = true;
  const isCorrect = s.trOptions[s.trSelected].correct;
  if(isCorrect){ playSound('ok'); state.levelScores[1]+=1; state.totalScore+=1; }
  else { playSound('falha'); }
  renderLevel1();
}

/* =========================================================
   NÍVEL 2 — LÓGICA E INTERFACE
   ========================================================= */
function setupLevel2Question(idx){
  const q = level2Data[idx];
  state.l2 = {
    step:'A',
    b1Options: shuffle(q.blank1.options), b1Selected:null,
    b2Options: shuffle(q.blank2.options), b2Selected:null,
    checkedA:false,
    trOptions: shuffle([{text:q.transCorrect,correct:true}, ...q.transWrong.map(w=>({text:w,correct:false}))]),
    trSelected:null, checkedB:false
  };
}

function renderLevel2(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  const content = document.getElementById('content');

  if(s.step==='A'){
    const span1 = blankSpanHtml(s.b1Selected, s.b1Options, q.blank1.correct, s.checkedA, 1);
    const span2 = blankSpanHtml(s.b2Selected, s.b2Options, q.blank2.correct, s.checkedA, 2);
    const sentence = q.frBlanked.replace('[ 1 ]', span1).replace('[ 2 ]', span2);

    const btns1 = s.b1Options.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.blank1.correct) cls+=' correct'; else if(i===s.b1Selected) cls+=' wrong'; }
      else if(i===s.b1Selected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedA?'disabled':''} onclick="selectL2Blank(1,${i})">${w}</button>`;
    }).join('');

    const btns2 = s.b2Options.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.blank2.correct) cls+=' correct'; else if(i===s.b2Selected) cls+=' wrong'; }
      else if(i===s.b2Selected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedA?'disabled':''} onclick="selectL2Blank(2,${i})">${w}</button>`;
    }).join('');

    const btnLabel = s.checkedA ? 'continuar' : 'verificar lacunas';
    const btnOnclick = s.checkedA ? 'advanceL2Step()' : 'checkL2Blanks()';
    const btnDisabled = !s.checkedA && (s.b1Selected===null || s.b2Selected===null);

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Complete as duas lacunas</p>
        <p class="fr-sentence">${sentence}</p>
        <p class="chip-label">Lacuna 1</p>
        <div class="chip-row">${btns1}</div>
        <p class="chip-label">Lacuna 2</p>
        <div class="chip-row">${btns2}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedB?'disabled':''} onclick="selectL2Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'próxima questão' : 'verificar tradução';
    const btnOnclick = s.checkedB ? 'nextQuestion()' : 'checkL2Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Escolha a tradução correta</p>
        <p class="fr-sentence">${q.frFull}</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function selectL2Blank(num, i){
  playSound('click');
  if(num===1) state.l2.b1Selected=i;
  else state.l2.b2Selected=i;
  renderLevel2();
}

function checkL2Blanks(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  s.checkedA = true;
  const is1Ok = s.b1Options[s.b1Selected] === q.blank1.correct;
  const is2Ok = s.b2Options[s.b2Selected] === q.blank2.correct;
  
  let pts = 0;
  if(is1Ok) pts += 1;
  if(is2Ok) pts += 1;
  
  state.levelScores[2] += pts;
  state.totalScore += pts;

  if(is1Ok && is2Ok) playSound('ok');
  else playSound('falha');
  renderLevel2();
}

function advanceL2Step(){ playSound('click'); state.l2.step='B'; renderLevel2(); }

function selectL2Translation(i){ playSound('click'); state.l2.trSelected=i; renderLevel2(); }

function checkL2Translation(){
  const s = state.l2;
  s.checkedB = true;
  const isCorrect = s.trOptions[s.trSelected].correct;
  if(isCorrect){
    playSound('ok');
    state.levelScores[2] += 1.5;
    state.totalScore += 1.5;
  } else {
    playSound('falha');
  }
  renderLevel2();
}

/* =========================================================
   NÍVEL 3 — LÓGICA E INTERFACE
   ========================================================= */
function setupLevel3Question(idx){
  const q = level3Data[idx];
  const allTokens = [...q.correctTokens, ...q.distractors];
  
  const tiles = allTokens.map((txt, id) => ({ id, text: txt }));

  state.l3 = {
    bank: shuffle(tiles),
    placed: [],
    checked: false,
    isCorrect: false
  };
}

function renderLevel3(){
  const q = level3Data[state.qIndex];
  const s = state.l3;
  const content = document.getElementById('content');

  let rowCls = 'build-row';
  if(s.checked) rowCls += s.isCorrect ? ' row-correct' : ' row-wrong';

  const placedHtml = s.placed.length === 0
    ? `<span class="build-placeholder">Toque nas palavras abaixo para construir a frase...</span>`
    : s.placed.map(t => {
        let cls = 'tile placed';
        if(s.checked) cls += s.isCorrect ? ' correct' : ' wrong';
        return `<button class="${cls}" ${s.checked?'disabled':''} onclick="unplaceTile(${t.id})">${t.text}</button>`;
      }).join('');

  const bankHtml = s.bank.map(t => {
    const isUsed = s.placed.some(p => p.id === t.id);
    if(isUsed) return '';
    return `<button class="tile" ${s.checked?'disabled':''} onclick="placeTile(${t.id})">${t.text}</button>`;
  }).join('');

  const gabaritoHtml = (s.checked && !s.isCorrect)
    ? `<div class="gabarito"><strong>Correto:</strong> ${q.correctTokens.join(' ')}</div>`
    : '';

  const btnLabel = s.checked ? 'próxima questão' : 'verificar frase';
  const btnOnclick = s.checked ? 'nextQuestion()' : 'checkL3()';
  const btnDisabled = !s.checked && s.placed.length === 0;

  content.innerHTML = `
    <div class="question-card">
      <p class="instruction">Traduza para o francês</p>
      <div class="pt-sentence">${q.pt}</div>
      <div class="${rowCls}">${placedHtml}</div>
      ${gabaritoHtml}
      <div class="bank-row">${bankHtml}</div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
  `;
}

function placeTile(id){
  if(state.l3.checked) return;
  playSound('click');
  const item = state.l3.bank.find(t => t.id === id);
  if(item && !state.l3.placed.some(p => p.id === id)){
    state.l3.placed.push(item);
    renderLevel3();
  }
}

function unplaceTile(id){
  if(state.l3.checked) return;
  playSound('click');
  state.l3.placed = state.l3.placed.filter(p => p.id !== id);
  renderLevel3();
}

function checkL3(){
  const q = level3Data[state.qIndex];
  const s = state.l3;
  s.checked = true;

  const builtText = s.placed.map(t => t.text).join(' ');
  const targetText = q.correctTokens.join(' ');

  s.isCorrect = (builtText === targetText);

  if(s.isCorrect){
    playSound('ok');
    state.levelScores[3] += 4.5;
    state.totalScore += 4.5;
  } else {
    playSound('falha');
  }
  renderLevel3();
}

window.onload = () => { render(); };
</script>
</body>
</html>
