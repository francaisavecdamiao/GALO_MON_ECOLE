<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GALOLINGO — ESCOLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green: #58CC02;
    --green-dark: #46A302;
    --blue: #1CB0F6;
    --blue-dark: #1899D6;
    --gold: #FFC800;
    --gold-dark: #E6B400;
    --red: #FF4B4B;
    --red-dark: #EA2B2B;
    --text: #3C3C3C;
    --text-light: #6b7280;
    --bg: #F7F9FA;
    --card: #FFFFFF;
    --border: #E5E5E5;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
  }

  h1,h2{ font-family:'Baloo 2', sans-serif; margin:0; }

  #page{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display:flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }

  /* ---------- TOPBAR ---------- */
  #topbar{
    position: sticky;
    top:0;
    z-index: 10;
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 10px 16px 12px;
  }
  .topbar-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .level-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 15px;
    color: var(--text);
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .score-badge{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 15px;
    background: #FFF8E1;
    color:#B8860B;
    border: 2px solid var(--gold);
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
    flex-shrink:0;
  }
  .score-max{ font-weight:600; opacity:.7; font-size:12px; }
  .progress-track{
    background: #E5E5E5;
    border-radius: 999px;
    height: 12px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--green), #7ED321);
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* ---------- LAYOUT ---------- */
  main#content{
    flex:1;
    padding: 20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .3px;
    text-transform: uppercase;
    border: none;
    border-radius: 16px;
    padding: 15px 20px;
    cursor: pointer;
    color: #fff;
    background: var(--green);
    box-shadow: 0 4px 0 var(--green-dark);
    transition: transform .05s ease, box-shadow .05s ease, opacity .2s ease;
  }
  .btn:active:not(:disabled){ transform: translateY(4px); box-shadow: 0 0 0 var(--green-dark); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-block{ width:100%; margin-top:auto; position: sticky; bottom: 16px; }

  .footer-space{ flex:1; }

  /* ---------- HOME / LEVEL COMPLETE / FINAL ---------- */
  .home-card{
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 22px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    animation: popIn .35s ease;
  }
  .mascot{ font-size: 56px; line-height:1; margin-bottom:4px; }
  .home-card h1{ font-size: 24px; color: var(--text); }
  .home-sub{ font-size:15px; color: var(--text-light); margin:0; line-height:1.5; }
  .level-preview{ width:100%; display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .level-chip{
    display:flex; align-items:center; gap:10px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-weight:700;
    font-size:14px;
    text-align:left;
  }
  .chip-num{
    background: var(--blue);
    color:#fff;
    width:26px;height:26px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif;
    flex-shrink:0;
  }
  .chip-pts{ margin-left:auto; color: var(--gold-dark); font-family:'Baloo 2', sans-serif; }

  .final-score{
    font-family:'Baloo 2', sans-serif;
    font-size: 44px;
    font-weight: 800;
    color: var(--green-dark);
    margin: 4px 0;
  }
  .final-score span{ font-size:18px; color: var(--text-light); font-weight:700; }
  .breakdown{ width:100%; margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .breakdown-row{
    display:flex; justify-content:space-between;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-weight:700;
    font-size:14px;
  }

  /* ---------- QUESTION CARD ---------- */
  .question-card{
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    animation: popIn .3s ease;
  }
  .instruction{
    font-size:13px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-light);
    font-weight:700;
    margin:0 0 8px;
  }
  .fr-sentence{
    font-family:'Baloo 2', sans-serif;
    font-size: 20px;
    font-weight:600;
    color: var(--text);
    line-height:1.5;
    margin: 0 0 18px;
  }
  .pt-sentence{
    font-family:'Baloo 2', sans-serif;
    font-size: 19px;
    font-weight:600;
    color: var(--text);
    line-height:1.5;
    margin: 0 0 18px;
    background: #EFF8FF;
    border-left: 4px solid var(--blue);
    padding: 10px 14px;
    border-radius: 8px;
  }

  .options-grid{ display:flex; flex-direction:column; gap:10px; }
  .option-card{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size: 15px;
    text-align:left;
    background: #fff;
    border: 2px solid var(--border);
    border-bottom-width:4px;
    border-radius: var(--radius-md);
    padding: 13px 16px;
    color: var(--text);
    cursor:pointer;
    transition: all .12s ease;
  }
  .option-card:hover:not(:disabled){ background:#F7FBFF; }
  .option-card.selected{ border-color: var(--blue); background:#EFF8FF; color: var(--blue-dark); }
  .option-card.correct{ border-color: var(--green); background:#EEFAE2; color: var(--green-dark); }
  .option-card.wrong{ border-color: var(--red); background:#FFEDED; color: var(--red-dark); }
  .option-card:disabled{ cursor:default; }

  /* blanks (Nível 1 e 2) */
  .blank{
    display:inline-block;
    min-width: 34px;
    text-align:center;
    padding: 2px 10px;
    margin: 0 2px;
    border-radius: 8px;
    background: #EEE;
    color: var(--text-light);
    font-weight:800;
    border-bottom: 3px solid #CCC;
  }
  .blank-filled{ background:#EFF8FF; color: var(--blue-dark); border-bottom-color: var(--blue); }
  .blank-correct{ background:#EEFAE2; color: var(--green-dark); border-bottom-color: var(--green); }
  .blank-wrong{ background:#FFEDED; color: var(--red-dark); border-bottom-color: var(--red); }

  .chip-label{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
    color: var(--text-light); margin: 14px 0 8px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip-option{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size: 14px;
    background:#fff;
    border: 2px solid var(--border);
    border-bottom-width:4px;
    border-radius: 999px;
    padding: 9px 16px;
    cursor:pointer;
    color: var(--text);
    transition: all .12s ease;
  }
  .chip-option.selected{ border-color: var(--blue); background:#EFF8FF; color:var(--blue-dark); }
  .chip-option.correct{ border-color: var(--green); background:#EEFAE2; color:var(--green-dark); }
  .chip-option.wrong{ border-color: var(--red); background:#FFEDED; color:var(--red-dark); }

  /* build row (Nível 3) */
  .build-row{
    min-height: 52px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-md);
    padding: 10px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    margin-bottom: 16px;
    transition: border-color .2s ease, background .2s ease;
  }
  .build-row.row-correct{ border-style:solid; border-color: var(--green); background:#EEFAE2; }
  .build-row.row-wrong{ border-style:solid; border-color: var(--red); background:#FFEDED; }
  .build-placeholder{ color: var(--text-light); font-size:13px; font-style:italic; }

  .gabarito{
    font-size: 13px;
    color: var(--red-dark);
    background: #FFF3F3;
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin: -6px 0 14px;
  }

  .bank-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tile{
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size: 14px;
    background:#fff;
    border: 2px solid var(--border);
    border-bottom-width:4px;
    border-radius: 10px;
    padding: 9px 14px;
    cursor:pointer;
    color: var(--text);
    transition: transform .08s ease;
  }
  .tile:active{ transform: scale(.94); }
  .tile.placed{ background:#EFF8FF; border-color: var(--blue); color: var(--blue-dark); }
  .tile.placed.correct{ background:#EEFAE2; border-color: var(--green); color: var(--green-dark); }
  .tile.placed.wrong{ background:#FFEDED; border-color: var(--red); color: var(--red-dark); }

  @keyframes popIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="page">
  <div id="topbar"></div>
  <main id="content"></main>
</div>

<script>
/* =========================================================
   DADOS DO JOGO — TEMA: ESCOLA
   ========================================================= */

/* NÍVEL 1 — Uma lacuna + escolha da tradução
   Distratores da lacuna: fonologicamente parecidos com a palavra certa
   (ex.: correta "froid" -> erradas "fois", "boire"). */
const level1Data = [
  { frBlanked:"Lucas prend son [ 1 ] à dos pour aller dans la classe.",
    frFull:"Lucas prend son sac à dos pour aller dans la classe.",
    blank:{ options:["sac","lac","bac"], correct:"sac" },
    transCorrect:"Lucas pega sua mochila para ir na sala.",
    transWrong:["Lucas pega seu lápis para ir na sala.","Lucas pega sua mochila para ir ao pátio."] },
  { frBlanked:"L'enseignant entre dans la classe avec un [ 1 ] d'histoire.",
    frFull:"L'enseignant entre dans la classe avec un livre d'histoire.",
    blank:{ options:["livre","lièvre","livret"], correct:"livre" },
    transCorrect:"O professor entra na sala com um livro de história.",
    transWrong:["O professor entra na sala com um caderno de história.","O aluno entra na sala com um livro de história."] },
  { frBlanked:"Il y a une [ 1 ] et un crayon de couleur sur la table.",
    frFull:"Il y a une gomme et un crayon de couleur sur la table.",
    blank:{ options:["gomme","pomme","somme"], correct:"gomme" },
    transCorrect:"Há uma borracha e um lápis de cor em cima da mesa.",
    transWrong:["Há uma borracha e uma caneta de cor em cima da mesa.","Há uma borracha e um lápis de cor embaixo da mesa."] },
  { frBlanked:"Sophie aime utiliser un surligneur [ 1 ] pour marquer les lignes importantes.",
    frFull:"Sophie aime utiliser un surligneur jaune pour marquer les lignes importantes.",
    blank:{ options:["jaune","faune","jeune"], correct:"jaune" },
    transCorrect:"Sophie gosta de usar um marca-texto amarelo para marcar as linhas importantes.",
    transWrong:["Sophie gosta de usar uma caneta amarela para marcar as linhas importantes.","Sophie gosta de usar um marca-texto azul para marcar as linhas importantes."] },
  { frBlanked:"Pendant la récréation, les enfants vont jouer dans la [ 1 ].",
    frFull:"Pendant la récréation, les enfants vont jouer dans la cour.",
    blank:{ options:["cour","cours","court"], correct:"cour" },
    transCorrect:"Durante o recreio, as crianças vão brincar no pátio.",
    transWrong:["Durante a aula, as crianças vão brincar no pátio.","Durante o recreio, os professores vão brincar no pátio."] },
  { frBlanked:"Il écrit la date sur le tableau avec de la [ 1 ].",
    frFull:"Il écrit la date sur le tableau avec de la craie.",
    blank:{ options:["craie","vrai","frais"], correct:"craie" },
    transCorrect:"Ele escreve a data no quadro com giz.",
    transWrong:["Ele escreve o nome no quadro com giz.","Ele apaga a data no quadro com giz."] },
  { frBlanked:"Elle range les ciseaux et la [ 1 ] dans la trousse.",
    frFull:"Elle range les ciseaux et la colle dans la trousse.",
    blank:{ options:["colle","molle","folle"], correct:"colle" },
    transCorrect:"Ela guarda a tesoura e a cola no estojo.",
    transWrong:["Ela guarda a régua e a cola no estojo.","Ela guarda a tesoura e a cola na mochila."] },
  { frBlanked:"Les garçons font du [ 1 ] dans le gymnase avec l'enseignant.",
    frFull:"Les garçons font du sport dans le gymnase avec l'enseignant.",
    blank:{ options:["sport","fort","port"], correct:"sport" },
    transCorrect:"Os meninos fazem esporte na quadra com o professor.",
    transWrong:["As meninas fazem esporte na quadra com o professor.","Os meninos fazem esporte na biblioteca com o professor."] },
  { frBlanked:"On va à la cantine pour prendre le repas après la [ 1 ].",
    frFull:"On va à la cantine pour prendre le repas après la classe.",
    blank:{ options:["classe","glace","tasse"], correct:"classe" },
    transCorrect:"A gente vai à cantina para pegar a refeição depois da aula.",
    transWrong:["A gente vai à cantina para pegar a refeição antes da aula.","A gente vai à biblioteca para pegar a refeição depois da aula."] },
  { frBlanked:"Pour l'instant, les filles dessinent sur une [ 1 ] de papier.",
    frFull:"Pour l'instant, les filles dessinent sur une feuille de papier.",
    blank:{ options:["feuille","veille","feutre"], correct:"feuille" },
    transCorrect:"Por enquanto, as meninas desenham em uma folha de papel.",
    transWrong:["Por enquanto, os meninos desenham em uma folha de papel.","Por enquanto, as meninas escrevem em uma folha de papel."] }
];

/* NÍVEL 2 — Duas lacunas + escolha da tradução
   Distratores das lacunas: fonologicamente parecidos com a palavra certa. */
const level2Data = [
  { frBlanked:"Lucas [ 1 ] un taille-crayon parce que la mine est [ 2 ].",
    frFull:"Lucas cherche un taille-crayon parce que la mine est cassée.",
    blank1:{ options:["cherche","perche","berce"], correct:"cherche" },
    blank2:{ options:["cassée","passée","lassée"], correct:"cassée" },
    transCorrect:"Lucas procura um apontador porque a ponta está quebrada.",
    transWrong:["Lucas procura uma borracha porque a ponta está quebrada.","Lucas procura um apontador porque a ponta está nova."] },
  { frBlanked:"Ils utilisent l'[ 1 ] à la bibliothèque pour faire des [ 2 ].",
    frFull:"Ils utilisent l'ordinateur à la bibliothèque pour faire des recherches.",
    blank1:{ options:["ordinateur","orateur","radiateur"], correct:"ordinateur" },
    blank2:{ options:["recherches","brèches","tranches"], correct:"recherches" },
    transCorrect:"Eles usam o computador na biblioteca para fazer pesquisas.",
    transWrong:["Eles usam o computador na sala de aula para fazer pesquisas.","Eles usam o livro na biblioteca para fazer pesquisas."] },
  { frBlanked:"L'enseignant pose le [ 1 ] et la chemise sur son [ 2 ].",
    frFull:"L'enseignant pose le classeur et la chemise sur son bureau.",

    blank2:{ options:["bureau","bateau","cadeau"], correct:"bureau" },
    transCorrect:"O professor coloca o fichário e a pasta sobre sua mesa.",
    transWrong:["O professor coloca o livro e a pasta sobre sua mesa.","O aluno coloca o fichário e a pasta sobre sua mesa."] },

    frFull:"Elle préfère tracer des lignes droites avec une règle.",
    blank1:{ options:["tracer","placer","chasser"], correct:"tracer" },
    blank2:{ options:["règle","aigle","zèle"], correct:"règle" },
    transCorrect:"Ela prefere traçar linhas retas com uma régua.",
    transWrong:["Ela prefere traçar linhas curvas com uma régua.","Ela prefere apagar linhas retas com uma régua."] },
  { frBlanked:"Les amis [ 1 ] ensemble vers le bureau du [ 2 ].",
    frFull:"Les amis marchent ensemble vers le bureau du directeur.",
    blank1:{ options:["marchent","marquent","manquent"], correct:"marchent" },
    blank2:{ options:["directeur","correcteur","inspecteur"], correct:"directeur" },
    transCorrect:"Os amigos andam juntos em direção à diretoria.",
    transWrong:["Os amigos correm juntos em direção à diretoria.","Os professores andam juntos em direção à diretoria."] },
  { frBlanked:"Il a besoin d'un stylo [ 1 ] et d'un feutre [ 2 ] pour écrire.",

    transWrong:["Ele precisa de um lápis azul e de uma canetinha preta para escrever.","Ele precisa de uma caneta vermelha e de uma canetinha preta para escrever."] },
  { frBlanked:"C'est le [ 1 ] de français de Sophie sur la [ 2 ].",
    frFull:"C'est le cahier de français de Sophie sur la chaise.",
    blank1:{ options:["cahier","papier","métier"], correct:"cahier" },
    blank2:{ options:["chaise","fraise","braise"], correct:"chaise" },
    transCorrect:"É o caderno de francês de Sophie sobre a cadeira.",
    transWrong:["É o livro de francês de Sophie sobre a cadeira.","É o caderno de inglês de Sophie sobre a cadeira."] },
  { frBlanked:"Pendant l'Éducation Physique et Sportive, on [ 1 ] du sport [ 2 ].",
    frFull:"Pendant l'Éducation Physique et Sportive, on fait du sport ensemble.",
    blank1:{ options:["fait","lait","sait"], correct:"fait" },
    blank2:{ options:["ensemble","ressemble","assemble"], correct:"ensemble" },
    transCorrect:"Durante a Educação Física, a gente faz esporte juntos.",
    transWrong:["Durante a Educação Física, a gente faz esporte sozinho.","Durante o recreio, a gente faz esporte juntos."] },
  { frBlanked:"Elle range ses [ 1 ] dans le sac à dos [ 2 ] la chaise.",
    frFull:"Elle range ses affaires dans le sac à dos derrière la chaise.",
    blank1:{ options:["affaires","affiches","affamées"], correct:"affaires" },
    blank2:{ options:["derrière","première","lumière"], correct:"derrière" },
    transCorrect:"Ela guarda seus pertences na mochila atrás da cadeira.",
    transWrong:["Ela guarda seus pertences na mochila na frente da cadeira.","Ele guarda seus pertences na mochila atrás da cadeira."] },
  { frBlanked:"L'enseignant va [ 1 ] les [ 2 ] dans le cahier.",
    frFull:"L'enseignant va corriger les erreurs dans le cahier.",
    blank1:{ options:["corriger","diriger","obliger"], correct:"corriger" },
    blank2:{ options:["erreurs","chaleurs","couleurs"], correct:"erreurs" },
    transCorrect:"O professor vai corrigir os erros no caderno.",
    transWrong:["O professor vai corrigir os erros no quadro.","O aluno vai corrigir os erros no caderno."] }
];

/* NÍVEL 3 — Monte a frase (banco de palavras)
   2 distratores fonológicos por frase. */
const level3Data = [
  { pt:"As crianças entram na sala dos professores com o professor.",
    correctTokens:["Les","enfants","entrent","dans","la","salle","des","maîtres","avec","l'enseignant."],
    distractors:["mètres","rentrent"] },
  { pt:"Hoje, a gente vai estudar o livro de história na biblioteca.",
    correctTokens:["Aujourd'hui,","on","va","étudier","le","livre","d'histoire","à","la","bibliothèque."],
    distractors:["lièvre","publier"] },
  { pt:"Ele coloca um computador grande perto da mesa.",
    correctTokens:["Il","installe","un","grand","ordinateur","près","de","la","table."],
    distractors:["fable","grain"] },
  { pt:"Às vezes, as crianças visitam a secretaria para perguntar a hora.",
    correctTokens:["Parfois,","les","enfants","visitent","le","secrétariat","pour","demander","l'heure."],
    distractors:["leur","commander"] },
  { pt:"As crianças adoram ler um livro depois da refeição.",
    correctTokens:["Les","enfants","adorent","lire","un","livre","après","le","repas."],
    distractors:["rire","repos"] },
  { pt:"Os meninos e as meninas vão aos banheiros durante o recreio.",
    correctTokens:["Les","garçons","et","les","filles","vont","aux","toilettes","pendant","la","récréation."],
    distractors:["billes","sont"] },
  { pt:"O menino escreve na agenda com um giz de cera.",
    correctTokens:["Le","garçon","écrit","dans","l'agenda","avec","un","crayon","de","cire."],
    distractors:["tire","rayon"] },
  { pt:"As meninas gostam de brincar com os amigos perto do ginásio.",
    correctTokens:["Les","filles","aiment","jouer","avec","les","amis","près","du","gymnase."],
    distractors:["louer","tapis"] },
  { pt:"Sophie tem um marca-texto amarelo, mas Lucas prefere a canetinha preta.",
    correctTokens:["Sophie","a","un","surligneur","jaune","mais","Lucas","préfère","le","feutre","noir."],
    distractors:["faune","soir"] },
  { pt:"Cada criança coloca a régua e a borracha sobre a mesa.",
    correctTokens:["Chaque","enfant","pose","la","règle","et","la","gomme","sur","la","table."],
    distractors:["aigle","pomme"] }
];

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const state = {
  screen: 'home',
  level: 1,
  qIndex: 0,
  totalScore: 0,
  levelScores: {1:0, 2:0, 3:0},
  l1: null,
  l2: null,
  l3: null
};

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function formatScore(n){
  const rounded = Math.round(n*10)/10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

/* =========================================================
   SONOPLASTIA
   Os arquivos abaixo devem estar na mesma pasta deste HTML.
   ========================================================= */
const SOUND_FILES = {
  click: 'click.mp3',
  ok: 'ok.mp3',
  falha: 'falha.mp3',
  level: 'level.mp3',
  levelfail: 'levelfail.mp3',
  win: 'win01.mp3',
  losing: 'losing.mp3'
};
function playSound(name){
  try{
    const src = SOUND_FILES[name];
    if(!src) return;
    const audio = new Audio(src);
    audio.play().catch(()=>{ /* som indisponível ou bloqueado pelo navegador */ });
  }catch(e){ /* ignora se áudio não puder ser criado */ }
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
function levelMaxPts(lvl){ return lvl===1?20:(lvl===2?35:45); }
function levelPct(lvl){ return (state.levelScores[lvl]/levelMaxPts(lvl))*100; }

function startGame(){
  playSound('click');
  state.screen='game'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0,2:0,3:0};
  setupCurrentQuestion();
  render();
}

function setupCurrentQuestion(){
  if(state.level===1) setupLevel1Question(state.qIndex);
  else if(state.level===2) setupLevel2Question(state.qIndex);
  else setupLevel3Question(state.qIndex);
}

function nextQuestion(){
  playSound('click');
  state.qIndex++;
  if(state.qIndex>=10){
    state.screen='levelComplete';
    playSound(levelPct(state.level)>=70 ? 'level' : 'levelfail');
    render();
    return;
  }
  setupCurrentQuestion();
  render();
}

function startNextLevel(){
  playSound('click');
  state.level++; state.qIndex=0; state.screen='game';
  setupCurrentQuestion();
  render();
}

function goFinal(){
  playSound('click');
  state.screen='final';
  playSound(state.totalScore>=75 ? 'win' : 'losing');
  render();
}

function resetGame(){
  playSound('click');
  state.screen='home'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0,2:0,3:0};
  render();
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(){
  renderTopbar();
  const content = document.getElementById('content');
  if(state.screen==='home'){ content.innerHTML = homeTemplate(); }
  else if(state.screen==='game'){
    if(state.level===1) renderLevel1();
    else if(state.level===2) renderLevel2();
    else renderLevel3();
  }
  else if(state.screen==='levelComplete'){ content.innerHTML = levelCompleteTemplate(); }
  else if(state.screen==='final'){ content.innerHTML = finalTemplate(); }
}

function renderTopbar(){
  const bar = document.getElementById('topbar');
  const scoreTxt = formatScore(state.totalScore);
  let progressPct = 0;
  let levelLabel = 'GALOLINGO';
  if(state.screen==='game'){
    const completed = (state.level-1)*10 + state.qIndex;
    progressPct = Math.round((completed/30)*100);
    levelLabel = `Nível ${state.level} · Questão ${state.qIndex+1}/10`;
  } else if(state.screen==='levelComplete'){
    progressPct = Math.round((state.level*10/30)*100);
    levelLabel = `Nível ${state.level} concluído`;
  } else if(state.screen==='final'){
    progressPct = 100;
    levelLabel = 'Jogo concluído';
  } else {
    levelLabel = 'Pronto para começar?';
  }
  bar.innerHTML = `
    <div class="topbar-row">
      <span class="level-label">${levelLabel}</span>
      <span class="score-badge">🏆 ${scoreTxt}<span class="score-max">/100</span></span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  `;
}

/* =========================================================
   TELAS: HOME / LEVEL COMPLETE / FINAL
   ========================================================= */
function homeTemplate(){
  return `
    <div class="home-card">
      <div class="mascot">🐓</div>
      <h1>GALOLINGO</h1>
      <p class="home-sub">Tema: ESCOLA. Complete os 3 níveis e conquiste até <strong>100 pontos</strong>!</p>
      <div class="level-preview">
        <div class="level-chip"><span class="chip-num">1</span> Complete a Lacuna <span class="chip-pts">20 pts</span></div>
        <div class="level-chip"><span class="chip-num">2</span> Lacunas Duplas <span class="chip-pts">35 pts</span></div>
        <div class="level-chip"><span class="chip-num">3</span> Monte a Frase <span class="chip-pts">45 pts</span></div>
      </div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="startGame()">Começar</button>
  `;
}

function levelCompleteTemplate(){
  const lvl = state.level;
  const max = levelMaxPts(lvl);
  const earned = state.levelScores[lvl];
  const pct = levelPct(lvl);
  const passed = pct>=70;
  const mascot = passed ? '🐓😄' : '🐓😟';
  const moodMsg = passed
    ? 'Muito bem, esse galo está orgulhoso de você!'
    : 'Esse galo ficou meio apreensivo... vamos revisar mais um pouco!';
  const isLast = lvl===3;
  return `
    <div class="home-card">
      <div class="mascot">${mascot}</div>
      <h1>Nível ${lvl} concluído!</h1>
      <p class="home-sub">Você fez <strong>${formatScore(earned)} / ${max}</strong> pontos neste nível (${Math.round(pct)}%).</p>
      <p class="home-sub">${moodMsg}</p>
      <p class="home-sub">Pontuação total: <strong>${formatScore(state.totalScore)} / 100</strong></p>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="${isLast ? 'goFinal()' : 'startNextLevel()'}">
      ${isLast ? 'Ver Resultado Final' : 'Continuar para o Nível '+(lvl+1)}
    </button>
  `;
}

function finalTemplate(){
  const total = state.totalScore;
  const passed = total>=75;
  const mascot = passed ? '🐓🥳' : '🐓😭';
  const msg = passed
    ? 'Parabéns! Esse galo está cantando de alegria — você mandou muito bem em francês! 🎉'
    : 'Esse galo ficou super triste... capriche mais um pouco na próxima tentativa e tenha mais dedicação nos estudos! 💪';
  return `
    <div class="home-card">
      <div class="mascot">${mascot}</div>
      <h1>Resultado Final</h1>
      <p class="final-score">${formatScore(total)}<span> / 100</span></p>
      <p class="home-sub">${msg}</p>
      <div class="breakdown">
        <div class="breakdown-row"><span>Nível 1 — Lacuna</span><span>${formatScore(state.levelScores[1])} / 20</span></div>
        <div class="breakdown-row"><span>Nível 2 — Lacunas</span><span>${formatScore(state.levelScores[2])} / 35</span></div>
        <div class="breakdown-row"><span>Nível 3 — Monte a Frase</span><span>${formatScore(state.levelScores[3])} / 45</span></div>
      </div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="resetGame()">Jogar Novamente</button>
  `;
}

/* =========================================================
   HELPER — Lacuna (usado nos Níveis 1 e 2)
   ========================================================= */
function blankSpanHtml(selIdx, options, correctWord, checked, num){
  if(selIdx===null) return `<span class="blank">${num}</span>`;
  const word = options[selIdx];
  let cls = 'blank blank-filled';
  if(checked) cls = 'blank ' + (word===correctWord ? 'blank-correct' : 'blank-wrong');
  return `<span class="${cls}">${word}</span>`;
}

/* =========================================================
   NÍVEL 1 — Uma Lacuna + Tradução
   ========================================================= */
function setupLevel1Question(idx){
  const q = level1Data[idx];
  state.l1 = {
    step:'A',
    bOptions: shuffle(q.blank.options),
    bSelected:null, checkedA:false,
    trOptions: shuffle([{text:q.transCorrect,correct:true}, ...q.transWrong.map(w=>({text:w,correct:false}))]),
    trSelected:null, checkedB:false
  };
}

function renderLevel1(){
  const q = level1Data[state.qIndex];
  const s = state.l1;
  const content = document.getElementById('content');

  if(s.step==='A'){
    const span = blankSpanHtml(s.bSelected, s.bOptions, q.blank.correct, s.checkedA, 1);
    const sentence = q.frBlanked.replace('[ 1 ]', span);

    const btns = s.bOptions.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.blank.correct) cls+=' correct'; else if(i===s.bSelected) cls+=' wrong'; }
      else if(i===s.bSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedA?'disabled':''} onclick="selectL1Blank(${i})">${w}</button>`;
    }).join('');

    const btnLabel = s.checkedA ? 'Continuar' : 'Verificar Lacuna';
    const btnOnclick = s.checkedA ? 'advanceL1Step()' : 'checkL1Blank()';
    const btnDisabled = !s.checkedA && s.bSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Complete a lacuna</p>
        <p class="fr-sentence">${sentence}</p>
        <p class="chip-label">Lacuna</p>
        <div class="chip-row">${btns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedB?'disabled':''} onclick="selectL1Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'Continuar' : 'Verificar Tradução';
    const btnOnclick = s.checkedB ? 'nextQuestion()' : 'checkL1Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Frase completa</p>
        <p class="fr-sentence">${q.frFull}</p>
        <p class="instruction" style="margin-top:16px;">Escolha a tradução correta</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function selectL1Blank(i){
  if(state.l1.checkedA) return;
  playSound('click');
  state.l1.bSelected = i;
  renderLevel1();
}

function checkL1Blank(){
  const q = level1Data[state.qIndex];
  const s = state.l1;
  s.checkedA = true;
  const ok = s.bOptions[s.bSelected]===q.blank.correct;
  if(ok){ state.totalScore+=1; state.levelScores[1]+=1; }
  playSound(ok ? 'ok' : 'falha');
  renderLevel1();
  renderTopbar();
}

function advanceL1Step(){
  playSound('click');
  state.l1.step='B';
  renderLevel1();
}

function selectL1Translation(i){
  if(state.l1.checkedB) return;
  playSound('click');
  state.l1.trSelected = i;
  renderLevel1();
}

function checkL1Translation(){
  const s = state.l1;
  s.checkedB = true;
  const ok = s.trOptions[s.trSelected].correct;
  if(ok){ state.totalScore+=1; state.levelScores[1]+=1; }
  playSound(ok ? 'ok' : 'falha');
  renderLevel1();
  renderTopbar();
}

/* =========================================================
   NÍVEL 2 — Lacunas Duplas + Tradução
   ========================================================= */
function setupLevel2Question(idx){
  const q = level2Data[idx];
  state.l2 = {
    step:'A',
    b1options: shuffle(q.blank1.options),
    b2options: shuffle(q.blank2.options),
    b1selected:null, b2selected:null, checkedA:false,
    trOptions: shuffle([{text:q.transCorrect,correct:true}, ...q.transWrong.map(w=>({text:w,correct:false}))]),
    trSelected:null, checkedB:false
  };
}

function renderLevel2(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  const content = document.getElementById('content');

  if(s.step==='A'){
    const span1 = blankSpanHtml(s.b1selected, s.b1options, q.blank1.correct, s.checkedA, 1);
    const span2 = blankSpanHtml(s.b2selected, s.b2options, q.blank2.correct, s.checkedA, 2);
    const sentence = q.frBlanked.replace('[ 1 ]', span1).replace('[ 2 ]', span2);

    const b1btns = s.b1options.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.blank1.correct) cls+=' correct'; else if(i===s.b1selected) cls+=' wrong'; }
      else if(i===s.b1selected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedA?'disabled':''} onclick="selectL2Blank(1,${i})">${w}</button>`;
    }).join('');

    const b2btns = s.b2options.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.blank2.correct) cls+=' correct'; else if(i===s.b2selected) cls+=' wrong'; }
      else if(i===s.b2selected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedA?'disabled':''} onclick="selectL2Blank(2,${i})">${w}</button>`;
    }).join('');

    const canCheck = s.b1selected!==null && s.b2selected!==null;
    const btnLabel = s.checkedA ? 'Continuar' : 'Verificar Lacunas';
    const btnOnclick = s.checkedA ? 'advanceL2Step()' : 'checkL2Blanks()';
    const btnDisabled = !s.checkedA && !canCheck;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Etapa A · Complete as lacunas</p>
        <p class="fr-sentence">${sentence}</p>
        <p class="chip-label">Lacuna 1</p>
        <div class="chip-row">${b1btns}</div>
        <p class="chip-label">Lacuna 2</p>
        <div class="chip-row">${b2btns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedB?'disabled':''} onclick="selectL2Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'Continuar' : 'Verificar Tradução';
    const btnOnclick = s.checkedB ? 'nextQuestion()' : 'checkL2Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Etapa B · Frase completa</p>
        <p class="fr-sentence">${q.frFull}</p>
        <p class="instruction" style="margin-top:16px;">Escolha a tradução correta</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function selectL2Blank(which, i){
  if(state.l2.checkedA) return;
  playSound('click');
  if(which===1) state.l2.b1selected=i; else state.l2.b2selected=i;
  renderLevel2();
}

function checkL2Blanks(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  s.checkedA = true;
  const b1ok = s.b1options[s.b1selected]===q.blank1.correct;
  const b2ok = s.b2options[s.b2selected]===q.blank2.correct;
  if(b1ok){ state.totalScore+=1; state.levelScores[2]+=1; }
  if(b2ok){ state.totalScore+=1; state.levelScores[2]+=1; }
  playSound(b1ok && b2ok ? 'ok' : 'falha');
  renderLevel2();
  renderTopbar();
}

function advanceL2Step(){
  playSound('click');
  state.l2.step='B';
  renderLevel2();
}

function selectL2Translation(i){
  if(state.l2.checkedB) return;
  playSound('click');
  state.l2.trSelected = i;
  renderLevel2();
}

function checkL2Translation(){
  const s = state.l2;
  s.checkedB = true;
  if(s.trOptions[s.trSelected].correct){
    state.totalScore+=1.5; state.levelScores[2]+=1.5;
    playSound('ok');
  } else {
    playSound('falha');
  }
  renderLevel2();
  renderTopbar();
}

/* =========================================================
   NÍVEL 3 — Monte a Frase (banco de palavras)
   ========================================================= */
function setupLevel3Question(idx){
  const q = level3Data[idx];
  const bank = shuffle([...q.correctTokens, ...q.distractors]).map((w,i)=>({ id:i, word:w, used:false }));
  state.l3 = { bank, built:[], checked:false };
}

function renderLevel3(){
  const q = level3Data[state.qIndex];
  const s = state.l3;
  const builtWords = s.built.map(id=>s.bank.find(b=>b.id===id).word);
  const isCorrect = s.checked && builtWords.join(' ')===q.correctTokens.join(' ');

  const builtHtml = s.built.map(id=>{
    const b = s.bank.find(x=>x.id===id);
    let cls='tile placed';
    if(s.checked) cls += isCorrect ? ' correct' : ' wrong';
    return `<button class="${cls}" ${s.checked?'disabled':''} onclick="removeL3Tile(${b.id})">${b.word}</button>`;
  }).join('');

  const bankHtml = s.bank.filter(b=>!b.used).map(b=>{
    return `<button class="tile" ${s.checked?'disabled':''} onclick="addL3Tile(${b.id})">${b.word}</button>`;
  }).join('');

  const canCheck = s.built.length===q.correctTokens.length;
  const btnLabel = s.checked ? 'Continuar' : 'Verificar';
  const btnOnclick = s.checked ? 'nextQuestion()' : 'checkL3()';
  const btnDisabled = !s.checked && !canCheck;

  const gabarito = (s.checked && !isCorrect)
    ? `<p class="gabarito">Ordem correta: <strong>${q.correctTokens.join(' ')}</strong></p>`
    : '';

  document.getElementById('content').innerHTML = `
    <div class="question-card">
      <p class="instruction">Monte a frase em francês</p>
      <p class="pt-sentence">${q.pt}</p>
      <div class="build-row ${s.checked ? (isCorrect?'row-correct':'row-wrong') : ''}">
        ${builtHtml || '<span class="build-placeholder">Toque nas palavras abaixo, na ordem certa</span>'}
      </div>
      ${gabarito}
      <div class="bank-row">${bankHtml}</div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
  `;
}

function addL3Tile(id){
  const s = state.l3;
  if(s.checked) return;
  const item = s.bank.find(b=>b.id===id);
  if(item.used) return;
  playSound('click');
  item.used = true;
  s.built.push(id);
  renderLevel3();
}

function removeL3Tile(id){
  const s = state.l3;
  if(s.checked) return;
  playSound('click');
  const item = s.bank.find(b=>b.id===id);
  item.used = false;
  s.built = s.built.filter(x=>x!==id);
  renderLevel3();
}

function checkL3(){
  const q = level3Data[state.qIndex];
  const s = state.l3;
  s.checked = true;
  const builtWords = s.built.map(id=>s.bank.find(b=>b.id===id).word);
  if(builtWords.join(' ')===q.correctTokens.join(' ')){
    state.totalScore += 4.5;
    state.levelScores[3] += 4.5;
    playSound('ok');
  } else {
    playSound('falha');
  }
  renderLevel3();
  renderTopbar();
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
render();
</script>
</body>
</html>
