<style>
  /* Carregamento da fonte Feather-Bold */
  @font-face {
    font-family: 'Feather Bold';
    src: url('fonts/Feather-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
  }

  :root{
    /* Sua Paleta Solicitada */
    --rosa: #F2A7AD;
    --laranja-escuro: #EF7211;
    --azul-claro: #C2EDF2;
    --amarelo: #F2A444;
    --laranja-salmao: #F2B28D;
    --vermelho: #D93636;

    /* Derivações para sombras e estados */
    --laranja-dark: #C95C08;
    --vermelho-dark: #B02626;
    --azul-dark: #8EC2C9;
    --green-correct: #48B832;
    --green-correct-dark: #379425;
    
    --text: #3C3C3C;
    --text-light: #6b7280;
    --bg: #F7F9FA;
    --card: #FFFFFF;
    --border: #E5E5E5;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
  }

  /* Uso da fonte Feather-Bold em títulos e textos grandes */
  h1, h2, .level-label, .score-badge, .btn, .chip-num, .chip-pts, .final-score, .fr-sentence, .pt-sentence {
    font-family: 'Feather Bold', 'Nunito', sans-serif;
  }

  #page{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display:flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }

  /* ---------- TOPBAR ---------- */
  #topbar{
    position: sticky;
    top:0;
    z-index: 10;
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 10px 16px 12px;
  }
  .topbar-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .level-label{
    font-size: 16px;
    color: var(--text);
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
    text-transform: lowercase;
  }
  .score-badge{
    font-size: 15px;
    background: #FFF5EA;
    color: var(--laranja-escuro);
    border: 2px solid var(--amarelo);
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
    flex-shrink:0;
  }
  .score-max{ font-weight:600; opacity:.7; font-size:12px; }
  .progress-track{
    background: var(--border);
    border-radius: 999px;
    height: 12px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--amarelo), var(--laranja-escuro));
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* ---------- LAYOUT ---------- */
  main#content{
    flex:1;
    padding: 20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .btn{
    font-size: 18px;
    letter-spacing: .3px;
    text-transform: lowercase;
    border: none;
    border-radius: 16px;
    padding: 15px 20px;
    cursor: pointer;
    color: #ffffff !important; /* TEXTO EM BRANCO */
    background: var(--laranja-escuro);
    box-shadow: 0 5px 0 var(--laranja-dark);
    transition: transform .05s ease, box-shadow .05s ease, opacity .2s ease;
  }
  .btn:active:not(:disabled){ transform: translateY(4px); box-shadow: 0 1px 0 transparent; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-block{ width:100%; margin-top:auto; position: sticky; bottom: 16px; }

  .footer-space{ flex:1; }

  /* ---------- HOME / LEVEL COMPLETE / FINAL ---------- */
  .home-card{
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 22px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    animation: popIn .35s ease;
  }
  
  .mascot-img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    margin-bottom: 8px;
  }

  .home-card h1{ font-size: 26px; color: var(--text); text-transform: lowercase; }
  .home-sub{ font-size:15px; color: var(--text-light); margin:0; line-height:1.5; }
  .level-preview{ width:100%; display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .level-chip{
    display:flex; align-items:center; gap:10px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-weight:700;
    font-size:14px;
    text-align:left;
  }
  .chip-num{
    background: var(--rosa);
    color:#fff !important; /* TEXTO EM BRANCO */
    width:28px; height:28px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .chip-pts{ margin-left:auto; color: var(--laranja-escuro); }

  .final-score{
    font-size: 44px;
    color: var(--laranja-escuro);
    margin: 4px 0;
  }
  .final-score span{ font-size:18px; color: var(--text-light); font-weight:700; }
  .breakdown{ width:100%; margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .breakdown-row{
    display:flex; justify-content:space-between;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-weight:700;
    font-size:14px;
  }

  /* ---------- QUESTION CARD ---------- */
  .question-card{
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    animation: popIn .3s ease;
  }
  .instruction{
    font-size:13px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-light);
    font-weight:700;
    margin:0 0 8px;
  }
  .fr-sentence{
    font-size: 21px;
    color: var(--text);
    line-height:1.4;
    margin: 0 0 18px;
  }
  .pt-sentence{
    font-size: 20px;
    color: var(--text);
    line-height:1.4;
    margin: 0 0 18px;
    background: #F0FAFC;
    border-left: 4px solid var(--azul-dark);
    padding: 10px 14px;
    border-radius: 8px;
  }

  .options-grid{ display:flex; flex-direction:column; gap:10px; }
  .option-card{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size: 15px;
    text-align:left;
    background: var(--laranja-escuro); /* Fundo com a cor do tema para contrastar com o texto branco */
    border: 2px solid var(--laranja-dark);
    border-bottom-width:4px;
    border-radius: var(--radius-md);
    padding: 13px 16px;
    color: #ffffff !important; /* TEXTO EM BRANCO */
    cursor:pointer;
    transition: all .12s ease;
  }
  .option-card:hover:not(:disabled){ background: var(--laranja-dark); }
  .option-card.selected{ border-color: var(--laranja-dark); background: var(--laranja-salmao); color: #ffffff !important; }
  .option-card.correct{ border-color: var(--green-correct-dark); background: var(--green-correct); color: #ffffff !important; }
  .option-card.wrong{ border-color: var(--vermelho-dark); background: var(--vermelho); color: #ffffff !important; }
  .option-card:disabled{ cursor:default; }

  /* blanks (Nível 1 e 2) */
  .blank{
    display:inline-block;
    min-width: 34px;
    text-align:center;
    padding: 2px 10px;
    margin: 0 2px;
    border-radius: 8px;
    background: #EEE;
    color: var(--text-light);
    font-weight:800;
    border-bottom: 3px solid #CCC;
  }
  .blank-filled{ background: var(--laranja-escuro); color: #ffffff !important; border-bottom-color: var(--laranja-dark); }
  .blank-correct{ background: var(--green-correct); color: #ffffff !important; border-bottom-color: var(--green-correct-dark); }
  .blank-wrong{ background: var(--vermelho); color: #ffffff !important; border-bottom-color: var(--vermelho-dark); }

  .chip-label{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
    color: var(--text-light); margin: 14px 0 8px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip-option{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size: 14px;
    background: var(--laranja-escuro);
    border: 2px solid var(--laranja-dark);
    border-bottom-width:4px;
    border-radius: 999px;
    padding: 9px 16px;
    cursor:pointer;
    color: #ffffff !important; /* TEXTO EM BRANCO */
    transition: all .12s ease;
  }
  .chip-option.selected{ border-color: var(--laranja-dark); background: var(--laranja-salmao); color:#ffffff !important; }
  .chip-option.correct{ border-color: var(--green-correct-dark); background: var(--green-correct); color:#ffffff !important; }
  .chip-option.wrong{ border-color: var(--vermelho-dark); background: var(--vermelho); color:#ffffff !important; }

  /* build row (Nível 3) */
  .build-row{
    min-height: 52px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-md);
    padding: 10px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    margin-bottom: 16px;
    transition: border-color .2s ease, background .2s ease;
  }
  .build-row.row-correct{ border-style:solid; border-color: var(--green-correct); background:#EAF9E7; }
  .build-row.row-wrong{ border-style:solid; border-color: var(--vermelho); background:#FDF0F0; }
  .build-placeholder{ color: var(--text-light); font-size:13px; font-style:italic; }

  .gabarito{
    font-size: 13px;
    color: var(--vermelho-dark);
    background: #FDF0F0;
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin: -6px 0 14px;
  }

  .bank-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tile{
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size: 14px;
    background: var(--laranja-escuro);
    border: 2px solid var(--laranja-dark);
    border-bottom-width:4px;
    border-radius: 10px;
    padding: 9px 14px;
    cursor:pointer;
    color: #ffffff !important; /* TEXTO EM BRANCO */
    transition: transform .08s ease;
  }
  .tile:active{ transform: scale(.94); }
  .tile.placed{ background: var(--laranja-salmao); border-color: var(--laranja-dark); color: #ffffff !important; }
  .tile.placed.correct{ background: var(--green-correct); border-color: var(--green-correct-dark); color: #ffffff !important; }
  .tile.placed.wrong{ background: var(--vermelho); border-color: var(--vermelho-dark); color: #ffffff !important; }

  @keyframes popIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
